<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — SWARM</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#05070f">
<link rel="icon" type="image/png" sizes="32x32" href="./press/favicon-32.png">
<style>
  :root {
    --bg: #05070f;
    --text: #ebf7ff;
    --muted: #8fa3b8;
    --accent: #4dffe0;
    --line: #1c2940;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    line-height: 1.6;
    background:
      radial-gradient(circle at 50% 20%, rgba(77, 255, 224, .12), transparent 34rem),
      var(--bg);
  }

  main {
    width: min(620px, 100%);
    padding: 34px;
    text-align: center;
    background: rgba(11, 16, 32, .92);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 26px 80px rgba(0, 0, 0, .35);
  }

  .code {
    display: inline-block;
    color: var(--accent);
    font-size: .78rem;
    font-weight: 800;
    letter-spacing: .18em;
  }

  h1 {
    margin: 12px 0 8px;
    color: var(--accent);
    font-size: clamp(2rem, 8vw, 3.4rem);
    letter-spacing: .12em;
  }

  p { color: var(--muted); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
  }

  a {
    display: inline-block;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
  }

  .primary { background: var(--accent); color: #04110f; }
  .secondary { color: var(--text); border: 1px solid var(--line); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <span class="code">ERRO 404</span>
  <h1>PÁGINA PERDIDA</h1>
  <p>Esse link não existe ou foi movido. Volte para a página inicial ou envie seu feedback.</p>
  <div class="actions">
    <a class="primary" href="./">Página inicial</a>
    <a class="secondary" href="./feedback/">Enviar feedback</a>
  </div>
</main>
</body>
</html>
